<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17110d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="D&L ACC">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2317110d'/%3E%3Ctext x='50' y='61' text-anchor='middle' font-size='32' font-family='serif' fill='%23e6c88a'%3ED%26L%3C/text%3E%3C/svg%3E">
<title>D&L ACC | المفضلة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
.favorites-page{min-height:100vh;padding-bottom:80px}.favorites-hero{width:min(1120px,calc(100% - 30px));margin:55px auto 35px;display:flex;align-items:end;justify-content:space-between;gap:25px}.favorites-hero h1{font-family:'Playfair Display','Cairo',serif;font-size:clamp(38px,6vw,68px);margin:10px 0}.favorites-hero p{color:var(--muted);line-height:1.9;margin:0;max-width:600px}.share-wishlist-btn{display:inline-flex;align-items:center;gap:9px;color:var(--surface);text-decoration:none;border:1px solid transparent;padding:11px 16px;border-radius:999px;background:linear-gradient(135deg,var(--text),#3a2a20);font-weight:900;transition:.3s;cursor:pointer;box-shadow:0 10px 25px rgba(57,39,25,.12)}.share-wishlist-btn:hover{transform:translateY(-2px);box-shadow:0 15px 32px rgba(57,39,25,.18)}.share-wishlist-btn i{color:#e6c88a}.favorites-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.shared-banner{width:min(1120px,calc(100% - 30px));margin:0 auto 24px;padding:15px 18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(200,155,91,.13),var(--surface));display:flex;align-items:center;justify-content:space-between;gap:15px}.shared-banner strong{display:block;margin-bottom:4px}.shared-banner span{color:var(--muted);font-size:13px}.save-shared-btn{border:0;border-radius:12px;padding:10px 14px;background:var(--gold);color:#24180f;font-weight:900;cursor:pointer}.share-note{width:min(1120px,calc(100% - 30px));margin:-12px auto 25px;color:var(--muted);font-size:12px}.favorites-back{display:inline-flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;border:1px solid var(--line);padding:11px 16px;border-radius:999px;background:var(--surface);font-weight:800;transition:.3s}.favorites-back:hover{border-color:var(--gold);transform:translateY(-2px)}.favorites-grid{width:min(1120px,calc(100% - 30px));margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.favorite-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 38px rgba(57,39,25,.07);transition:.35s;animation:favoriteIn .45s both}.favorite-card:hover{transform:translateY(-7px);box-shadow:0 25px 55px rgba(57,39,25,.14)}.favorite-image{height:270px;background:radial-gradient(circle,rgba(200,155,91,.14),transparent 62%),var(--surface-2);padding:15px;position:relative}.favorite-image img{width:100%;height:100%;object-fit:contain}.remove-favorite{position:absolute;top:14px;left:14px;width:40px;height:40px;border:1px solid rgba(255,255,255,.65);border-radius:50%;background:rgba(255,255,255,.88);color:#a94a55;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.1);z-index:2}.dark-theme .remove-favorite{background:rgba(25,21,18,.86);color:#ff8792;border-color:rgba(255,255,255,.12)}.favorite-body{padding:17px}.favorite-category{font-size:10px;color:var(--gold-dark);font-weight:800}.dark-theme .favorite-category{color:var(--gold-2)}.favorite-body h3{margin:7px 0 12px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.favorite-footer{display:flex;align-items:center;justify-content:space-between;gap:10px}.favorite-price{font-weight:900;font-size:16px}.favorite-cart{border:0;border-radius:13px;padding:10px 12px;background:var(--text);color:var(--surface);font-weight:800;cursor:pointer}.favorite-cart:hover{background:var(--gold-dark)}.favorites-empty{width:min(650px,calc(100% - 30px));margin:100px auto;text-align:center;padding:55px 25px;border:1px dashed var(--line);border-radius:30px;background:var(--surface)}.favorites-empty i{font-size:48px;color:var(--gold);margin-bottom:18px}.favorites-empty h2{font-family:'Playfair Display','Cairo',serif;font-size:32px;margin:0 0 10px}.favorites-empty p{color:var(--muted);line-height:1.9}.favorites-empty a{display:inline-flex;margin-top:18px;padding:12px 20px;border-radius:999px;background:var(--text);color:var(--surface);text-decoration:none;font-weight:800}@keyframes favoriteIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(max-width:900px){.favorites-grid{grid-template-columns:repeat(2,1fr)}.favorites-hero{align-items:start;flex-direction:column}.shared-banner{align-items:flex-start;flex-direction:column}.save-shared-btn{width:100%}}@media(max-width:560px){.favorites-grid{grid-template-columns:repeat(2,1fr);gap:10px}.favorite-image{height:190px}.favorite-body{padding:13px}.favorite-footer{align-items:stretch;flex-direction:column}.favorite-cart{width:100%}}
</style>

<style>
.share-overlay{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.58);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:18px}.share-modal{position:relative;width:min(560px,100%);max-height:min(88vh,700px);overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.35);text-align:center}.share-close{position:absolute;top:14px;left:14px;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--surface-2);color:var(--text);font-size:25px;cursor:pointer}.share-icon{font-size:42px;margin-bottom:5px}.share-modal h3{font-size:28px;margin:8px 0}.share-modal p{color:var(--muted);margin:0 0 18px;line-height:1.8}.share-link{direction:ltr;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:13px;word-break:break-all;font-size:12px;color:var(--muted);margin-bottom:15px}.share-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.share-buttons button,.share-buttons a{border:0;border-radius:14px;padding:13px 12px;font-weight:900;text-decoration:none;cursor:pointer;font-family:inherit}.share-buttons button{background:var(--text);color:var(--surface)}.share-buttons a{background:#25d366;color:#fff}@media(max-width:560px){.share-modal{padding:26px 18px;border-radius:22px}.share-buttons{grid-template-columns:1fr}.share-link{font-size:11px}}
</style>

</head>
<body class="light-theme favorites-page">
<header class="main-header">
  <div class="logo">D&L <span class="logo-sub">JEWELRY</span></div>
  <nav class="nav-links"><a class="filter-btn" href="index.html"><i class="fas fa-home"></i> الرئيسية</a></nav>
  <div class="header-actions">
    <button class="theme-toggle-btn" id="theme-toggle" title="تغيير المظهر"><i class="fas fa-moon" id="theme-icon"></i></button>
    <a class="cart-btn" href="index.html#products"><i class="fas fa-shopping-bag"></i><span>تسوقي</span></a>
  </div>
</header>
<main>
<section class="favorites-hero">
  <div><span class="eyebrow">YOUR D&L EDIT</span><h1>المفضلة <i class="fas fa-heart" style="font-size:.55em;color:var(--gold)"></i></h1><p>كل القطع اللي عجبتك في مكان واحد. المفضلة محفوظة على جهازك، وتفضل موجودة حتى بعد ما تقفلي الموقع.</p></div>
  <div class="favorites-actions"><button class="share-wishlist-btn" id="share-wishlist" type="button"><i class="fas fa-gift"></i> شاركي القائمة 🎁</button><a class="favorites-back" href="index.html"><i class="fas fa-arrow-right"></i> العودة للمتجر</a></div>
</section>
<div id="shared-banner-wrap"></div><div id="favorites-content"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://aurhnsykqlzmmuibcpft.supabase.co';
const SUPABASE_KEY='sb_publishable_RVS6brwbOqspCPW2QcDRPg_i4V0e2Cy';
const FAVORITES_STORAGE_KEY='dl_acc_favorites_v1';
const CART_STORAGE_KEY='dl_acc_cart_v2';
const FALLBACK_IMAGE='https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=500&q=80';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let favorites=new Set();let products=[];let sharedIds=null;
function img(v){try{const u=new URL(String(v||''),location.href);return /^https?:$/.test(u.protocol)?u.href:FALLBACK_IMAGE}catch(e){return FALLBACK_IMAGE}}
function loadFav(){try{const x=JSON.parse(localStorage.getItem(FAVORITES_STORAGE_KEY)||'[]');favorites=new Set(Array.isArray(x)?x.map(String):[])}catch(e){favorites=new Set()}}
function readSharedWishlist(){try{const raw=new URLSearchParams(location.search).get('wishlist');if(!raw)return null;const ids=atob(raw).split(',').map(x=>String(x).trim()).filter(Boolean);return ids.length?Array.from(new Set(ids)):null}catch(e){return null}}
function makeWishlistLink(){const ids=[...favorites].map(String).filter(Boolean);const encoded=btoa(ids.join(','));const base=(location.protocol==='file:'||location.origin==='null')?'https://aliaccessories195-source.github.io/D-L-ACC/favorites.html':`${location.origin}${location.pathname}`;return `${base}?wishlist=${encodeURIComponent(encoded)}`}
function openShareBox(link){const old=document.getElementById('wishlist-share-box');if(old)old.remove();const box=document.createElement('div');box.id='wishlist-share-box';box.innerHTML=`<div class="share-overlay"><div class="share-modal"><button class="share-close" type="button" aria-label="إغلاق">×</button><div class="share-icon">🎁</div><h3>شاركي قائمتك ❤️</h3><p>ابعتِي الرابط لحد يشوف القطع اللي عاجباكي.</p><div class="share-link">${link.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div><div class="share-buttons"><button id="copy-wishlist" type="button">📋 نسخ الرابط</button><a id="wa-wishlist" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('دي الحاجات اللي عاجباني 😂❤️\nشوّفي قائمتي من D&L ACC:\n'+link)}">💚 إرسال واتساب</a></div></div></div>`;document.body.appendChild(box);box.querySelector('.share-close').onclick=()=>box.remove();box.querySelector('.share-overlay').onclick=e=>{if(e.target===e.currentTarget)box.remove()};box.querySelector('#copy-wishlist').onclick=async()=>{try{await navigator.clipboard.writeText(link);showShareStatus('اتنسخ رابط القائمة ❤️');box.remove()}catch(e){const ta=document.createElement('textarea');ta.value=link;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showShareStatus('اتنسخ رابط القائمة ❤️');box.remove()}}}
function shareWishlist(){if(!favorites.size){showShareStatus('ضيفي قطع للمفضلة الأول ❤️');return}openShareBox(makeWishlistLink())}
function showShareStatus(message){const btn=document.getElementById('share-wishlist');if(!btn)return;const old=btn.innerHTML;btn.innerHTML='<i class="fas fa-check"></i> '+message;setTimeout(()=>btn.innerHTML=old,2200)}
function renderSharedBanner(){const wrap=document.getElementById('shared-banner-wrap');if(!wrap)return;if(!sharedIds){wrap.innerHTML='';return}wrap.innerHTML='<section class="shared-banner"><div><strong>🎁 قائمة مفضلة مشتركة</strong><span>دي قائمة قطع متشاركة من D&L ACC. تقدري تحفظيها عندك بضغطة واحدة.</span></div><button class="save-shared-btn" id="save-shared" type="button">❤️ حفظ القائمة عندي</button></section>';document.getElementById('save-shared').onclick=()=>{sharedIds.forEach(id=>favorites.add(String(id)));saveFav();showShareStatus('اتحفظت القائمة عندك ❤️')}}
function saveFav(){localStorage.setItem(FAVORITES_STORAGE_KEY,JSON.stringify([...favorites]))}
function pricing(p){const original=Math.max(0,Number(p?.price)||0), enabled=Boolean(p?.discount_enabled)&&Number(p?.discount_value)>0, type=p?.discount_type==='fixed'?'fixed':'percent', value=Math.max(0,Number(p?.discount_value)||0); let sale=original; if(enabled)sale=type==='percent'?original*(1-Math.min(value,100)/100):original-Math.min(value,original); sale=Math.max(0,Math.round(sale*100)/100); return {original,sale,enabled:enabled&&sale<original,type,value,percent:original?Math.round((1-sale/original)*100):0}}
function price(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('ar-EG')+' ج.م':'السعر غير متوفر'}
function addCart(p){let c=[];try{c=JSON.parse(localStorage.getItem(CART_STORAGE_KEY)||'[]')}catch(e){};const id=String(p.id);const old=c.find(x=>String(x.id)===id);if(old)old.quantity=(Number(old.quantity)||0)+1;else c.push({id,name:String(p.title||'منتج'),price:pricing(p).sale,quantity:1});localStorage.setItem(CART_STORAGE_KEY,JSON.stringify(c));const btn=event?.currentTarget;if(btn){btn.innerHTML='<i class="fas fa-check"></i> تمت الإضافة';setTimeout(()=>btn.innerHTML='<i class="fas fa-shopping-bag"></i> إضافة للسلة',1200)}}
function render(){const root=document.getElementById('favorites-content');root.innerHTML='';const ids=sharedIds||[...favorites];const list=products.filter(p=>ids.includes(String(p.id)));if(!list.length){root.innerHTML='<section class="favorites-empty"><i class="far fa-heart"></i><h2>'+ (sharedIds ? 'القائمة دي مبقتش متاحة' : 'لسه مفيش قطع مفضلة') +'</h2><p>'+ (sharedIds ? 'ممكن تكون بعض القطع اتحذفت أو الرابط قديم.' : 'لما تعجبك أي قطعة، اضغطي على القلب ❤️ وهتلاقيها هنا فوراً.') +'</p><a href="index.html#products">اكتشفي المنتجات <i class="fas fa-arrow-left"></i></a></section>';return}const grid=document.createElement('section');grid.className='favorites-grid';list.forEach((p,i)=>{const card=document.createElement('article');card.className='favorite-card';card.style.animationDelay=(i*.05)+'s';const pp=pricing(p); const priceHtml=pp.enabled?'<span class="discount-old">'+price(pp.original)+'</span><span class="discount-new">'+price(pp.sale)+'</span> <small class="store-discount-badge">🔥 خصم '+(pp.type==='percent'?pp.value+'%':price(pp.value))+'</small>':price(pp.original); card.innerHTML='<div class="favorite-image"><button class="remove-favorite" title="إزالة من المفضلة" '+(sharedIds?'style="display:none"':'')+'><i class="fas fa-heart"></i></button><img loading="lazy" src="'+img(p.image)+'" alt=""></div><div class="favorite-body"><span class="favorite-category">'+(p.category||'إكسسوارات')+'</span><h3>'+String(p.title||'قطعة مميزة').replace(/[<>]/g,'')+'</h3><div class="favorite-footer"><span class="favorite-price">'+priceHtml+'</span><button class="favorite-cart"><i class="fas fa-shopping-bag"></i> إضافة للسلة</button></div></div>';card.querySelector('img').onerror=e=>e.currentTarget.src=FALLBACK_IMAGE;card.querySelector('.remove-favorite').onclick=()=>{favorites.delete(String(p.id));saveFav();render()};card.querySelector('.favorite-cart').onclick=(ev)=>{event=ev;addCart(p)};grid.appendChild(card)});root.appendChild(grid)}
async function load(){const {data,error}=await db.from('products').select('*');if(error){document.getElementById('favorites-content').innerHTML='<section class="favorites-empty"><i class="fas fa-triangle-exclamation"></i><h2>حصلت مشكلة في تحميل المفضلة</h2><p>جربي تحديث الصفحة مرة تانية.</p></section>';return}products=data||[];render()}
function theme(){const saved=localStorage.getItem('theme')||'light';document.body.classList.toggle('dark-theme',saved==='dark');document.body.classList.toggle('light-theme',saved!=='dark');document.getElementById('theme-icon').className=saved==='dark'?'fas fa-sun':'fas fa-moon'}
document.getElementById('theme-toggle').onclick=()=>{const dark=!document.body.classList.contains('dark-theme');localStorage.setItem('theme',dark?'dark':'light');theme()};sharedIds=readSharedWishlist();loadFav();theme();renderSharedBanner();document.getElementById('share-wishlist').onclick=shareWishlist;load();
</script>
<script src="register-sw.js" defer></script>
</body>
</html>
